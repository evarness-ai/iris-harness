name: security

# OSS plan R11's `security` checks: gitleaks over the tree and the full history, the
# identity scan in strict mode, and CodeQL for the Python code and the web console's
# TypeScript. `pull_request` only, never `pull_request_target` (see ci.yml).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1" # weekly, so CodeQL's new queries reach unchanged code
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with scripts/ci_local.sh (GITLEAKS_PIN) and the contributor's install.
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the history scan reads every commit
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # The tracked files: the identity patterns (scripts/oss_pii_patterns.txt; a fork
      # adds its own) and gitleaks, both in strict mode -- a warn-tier hit fails too.
      - name: Identity + secret scan (strict)
        run: bash scripts/oss_pii_scan.sh --strict
      # Every commit, so a secret added and then deleted in a later commit still fails.
      - name: gitleaks (history)
        run: gitleaks git . --config .gitleaks.toml --redact --no-banner --verbose

  codeql:
    name: codeql (${{ matrix.language }})
    # Code scanning on a private repository needs paid GitHub Advanced Security: while the
    # repository is private (before launch) CodeQL is skipped, not failed, and it starts on
    # its own once the repository is public. The `security` job (gitleaks, the identity
    # scan) runs either way.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload the results to code scanning
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
