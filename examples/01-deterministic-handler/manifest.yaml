name: opening_hours
version: 0.1.0
description: Answers "when is the library open?" from hours.yaml, with no model call.
# Provenance: who wrote this plugin. Left as `untrusted` so a copy of this manifest does
# not claim to be the harness's own code; change it only to say what is true of yours.
party: untrusted
entrypoint: opening_hours:setup
flavor: python
trust: in-process
provides:
  - intercept
