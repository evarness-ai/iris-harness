# Pre-commit hooks for IRIS. The hosted CI (.github/workflows) runs every required check on
# each pull request; these hooks catch the same failures before code leaves the machine.
#
# Two stages, plus one manual hook:
#   - commit   (fast, every commit): file-shape hooks + black + ruff (auto-fix).
#   - pre-push (before code leaves the machine): `scripts/ci_local.sh --fast` -- lint,
#              types, import contracts, changed-scope tests, playground smoke, identity +
#              secret scan (OSS plan R11) -- and the diagram lint.
#   - manual   the export's strict pass, where the export tooling exists.
#
# Install both:  poetry run pre-commit install
#                (installs commit + pre-push via default_install_hook_types below)
# Manual run:    poetry run pre-commit run --all-files                          (commit stage)
#                poetry run pre-commit run --hook-stage pre-push --all-files     (push gate)
#                poetry run pre-commit run --hook-stage manual oss-export-strict

default_install_hook_types: [pre-commit, pre-push]

repos:
  # Standard file-shape hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^config/skills/.*/agent\.md$  # agent.md is markdown, not YAML
      - id: check-added-large-files
        # the committed lockfile is ~900 KB by nature; everything else keeps the cap
        exclude: ^poetry\.lock$
        args: [--maxkb=500]
      - id: check-merge-conflict

  # check-merge-conflict only runs while a merge is in progress and does not know the diff3
  # base marker, so a marker left by a rebase resolution (committed by `git rebase --continue`,
  # which skips pre-commit) reached main in #733. This one runs on every commit and push.
  # A bare `=======` is left out: it is a legal Markdown setext underline.
  - repo: local
    hooks:
      - id: no-conflict-markers
        name: no conflict markers (commit + push gate)
        language: pygrep
        entry: '^(<{7}|>{7}|\|{7})( |$)'
        types: [text]
        stages: [pre-commit, pre-push]

  # Black — code formatter (pinned to match pyproject.toml ^24.1)
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        language_version: python3.12

  # Ruff — linter (pinned to match pyproject.toml ^0.1.14)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]

  # The push gate (OSS plan R11): `scripts/ci_local.sh --fast` -- ruff, black, mypy (src +
  # examples), import contracts, the changed-scope tests, the playground smoke and the
  # identity + secret scan, each reported in one summary table. The full suite runs in
  # the hosted CI on every pull request and in `scripts/ci_local.sh` (no flags) before a
  # merge; `FULL=1 git push` makes the changed-scope step run the full suite here too.
  - repo: local
    hooks:
      - id: ci-local-fast
        name: ci_local.sh --fast (push gate)
        entry: bash scripts/ci_local.sh --fast
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      # Manual only: the release-1 export's strict pass (every R11 check on a freshly
      # exported tree, in a fresh venv; several minutes). Exists only where the export
      # tooling does: `pre-commit run --hook-stage manual oss-export-strict`.
      - id: oss-export-strict
        name: oss_export.sh --strict (manual)
        entry: bash -c 'if [[ ! -f scripts/oss_export.sh ]]; then echo "no export tooling in this tree"; exit 0; fi; dir=$(mktemp -d "${TMPDIR:-/tmp}/iris-export.XXXXXX") && bash scripts/oss_export.sh --strict --no-init --target "$dir/tree"'
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]
      - id: diagrams
        # Architecture-diagram gate: drawio files are well-formed XML and every
        # ```mermaid block is a known diagram type (fast lint). The full mermaid
        # *render* (needs Node + headless browser) runs in GitHub Actions ci.yml.
        name: diagrams (drawio valid + mermaid lint · push gate)
        entry: python3 scripts/check_diagrams.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
