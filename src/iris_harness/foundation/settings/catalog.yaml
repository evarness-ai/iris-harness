    applies: restart
    label: Sessions kept in memory
    description: How many conversations keep their live window in the server's memory; the least
      recently used beyond this are dropped and reload from the memory store on their next turn.
    tab: advanced
  IRIS_SETTINGS_SIDECAR_CATALOGS:
    kind: path
    default: null
    applies: restart
    label: Sidecar settings catalogs
    description: Settings catalogs (YAML files separated by the path separator, each naming its
      owner) of processes the deployment runs beside the harness, such as an LLM proxy; the app
      lists their settings and leaves changing them to that process's environment.
    tab: none
    editable: false
    not_editable_reason: path
  IRIS_SKILL_HOTRELOAD:
    kind: bool
    default: false
    applies: restart
    label: Skill hot reload
    description: When truthy, watches the skills directory and reloads skills when their files change.
    tab: none
    editable: false
    not_editable_reason: dev-only switch
  IRIS_SKILL_ROUTER_SEMANTIC:
    kind: bool
    default: true
    applies: restart
    label: Semantic skill router
    description: When on, routine authoring and briefing-section extraction use an embedding-based
      SemanticSkillRouter; off forces the legacy keyword scorer.
    tab: features
  IRIS_SKILL_ROUTER_THRESHOLD:
    kind: float
    default: 0.45
    applies: restart
    label: Skill router similarity threshold
    description: Embedding-similarity threshold the semantic skill router uses to match a request
      to a skill (default 0.45 from semantic_router.py:29).
    tab: advanced
  IRIS_SKILL_SYNTHESIS:
    kind: bool
    default: false
    applies: restart
    label: Skill synthesis
    description: When on, the crystallizer uses a local-tier LLM to synthesize skills instead of
      falling back to a scaffold.
    tab: agents
  IRIS_STANDING_INSTRUCTIONS:
    kind: bool
    default: true
    applies: now
    label: Standing instructions capture
    description: When on, a chat message that teaches a rule is saved as a behavior and honored
      on later matching turns.
    tab: features
  IRIS_SYNC_MEMORY_BLOCKING:
    kind: bool
    default: false
    applies: restart
    label: Blocking memory sync
    description: When on, the startup memory-to-index sync runs inline before build_runtime returns
      instead of on a background thread.
    tab: advanced
  IRIS_SYNC_WIKI_BLOCKING:
    kind: bool
    default: false
    applies: restart
    label: Blocking wiki re-index
    description: When on (and wiki ingest is enabled), re-indexes wiki pages synchronously at startup
      instead of in a background thread.
    tab: advanced
  IRIS_THREAT_DETECTION_CONFIG:
    kind: path
    default: config/governance/threat-detection.yaml
    applies: restart
    label: Threat detection config path
    description: Overrides the path of the threat-detection (prompt guard) YAML config.
    tab: none
    guarded: true
    guard_reason: Pointing at another file can disable or weaken the prompt guard.
    editable: false
    not_editable_reason: path
  IRIS_TZ:
    kind: str
    default: UTC
    applies: restart
    label: Owner's time zone
    description: The owner's IANA time zone (e.g. America/Chicago). The morning digest's time, reminders
      and schedules are read in it; the Docker Compose files also set the container clock (TZ) from
      it. Unset or not a zone name means UTC.
    tab: none
    editable: false
    not_editable_reason: compose sets the container clock from it at start; set it in .env (the deploy
      copies it to server.env)
  IRIS_USER_ID:
    kind: str
    default: local
    applies: restart
    label: Cost ledger user id
    description: User id under which LLM spend is recorded and summed against the daily cost cap.
    tab: none
    guarded: true
    guard_reason: Changing it starts a fresh spend total, so the daily cost cap is counted from
      zero.
    editable: false
    not_editable_reason: it names whose data and cost ledger this is; not a switch
  IRIS_VAULT_MASTER_KEY:
    kind: secret
    default: null
    applies: restart
    label: Vault master key
    description: Fernet master key for the credential vault and the file vault, used instead of
      the OS keyring.
    tab: none
    guarded: true
    guard_reason: Key material for encrypted vaults.
    editable: false
    not_editable_reason: secret
  IRIS_VAULT_PASSPHRASE:
    kind: secret
    default: null
    applies: now
    label: Vault passphrase
    description: Passphrase from which the encrypted-file vault key is derived (scrypt) when IRIS_SECRET_BACKEND=vault;
      unset uses a keychain-held key.
    tab: none
    guarded: true
    guard_reason: It is key material protecting stored secrets.
    editable: false
    not_editable_reason: Secret
  IRIS_WEBUI_ALLOW_WRITES:
    kind: bool
    default: false
    applies: now
    label: Web UI control writes
    description: Allows gated control writes from callers without a paired device (shared secret
      or no credentials); paired devices are judged by their own scope regardless.
    tab: guards
    guarded: true
    guard_reason: Changes who may perform control writes through the API.
  IRIS_WEBUI_DIST:
    kind: path
    default: /app/webui/dist
    applies: restart
    label: Web UI build directory
    description: Directory the API serves the built web UI from; without an index.html there the
      UI is not served.
    tab: none
    editable: false
    not_editable_reason: path
  IRIS_WEB_PUSH_SUBJECT:
    kind: url
    default: https://github.com/evarness-ai/iris-harness
    applies: now
    label: Web push VAPID subject
    description: Contact subject (URL or mailto) sent in Web Push VAPID claims.
    tab: none
    editable: false
    not_editable_reason: URL
  IRIS_WEB_PUSH_VAPID_PRIVATE_KEY:
    kind: secret
    default: null
    applies: now
    label: Web push VAPID key
    description: PEM EC private key used to sign web push requests instead of the generated key
      file; changing it breaks existing subscriptions.
    tab: none
    guarded: true
    guard_reason: It is signing key material.
    editable: false
    not_editable_reason: secret
  IRIS_WIKI_INGEST:
    kind: bool
    default: false
    applies: restart
    label: Automatic wiki ingest
    description: When on, chat turns and classified emails are automatically ingested into wiki
      pages and pages are re-embedded at startup.
    tab: features
  IRIS_DISABLE_EXTERNAL_WRITES:
    kind: bool
    default: false
    applies: now
    label: Disable external writes
    description: When set to 1, calendar writes stay local (no Apple or Google Calendar providers
      are registered); the playground and learning preflight set it for their sandboxes.
    tab: none
    editable: false
    not_editable_reason: harness sets it for eval/playground sandboxes
  IRIS_SUPERVISED:
    kind: bool
    default: false
    applies: restart
    label: Supervised restarts
    description: Set by a deployment whose supervisor restarts every server that exits (a compose file
      with restart policies, for example); only then may the app's Restart harness ask the servers
      to exit.
    tab: none
    editable: false
    not_editable_reason: the deploy says whether a supervisor exists; the app cannot

  IRIS_RESTART_ON_REQUEST:
    kind: bool
    default: true
    applies: restart
    label: Exit on the app's restart request
    description: Under a supervisor, whether this server exits when the app's Restart harness asks.
      A deployment whose governor owns the network namespace the other services share sets it off
      on the governor.
    tab: none
    editable: false
    not_editable_reason: the deploy decides which process owns the shared network; the app cannot

# IRIS_* literals in the code that are not settings, and why.
not_settings:
  IRIS_EGRESS_ALLOWLIST: set by harness for its child container
  IRIS_EGRESS_PORT: set by the harness for its own sidecar
  IRIS_GOOGLE_OAUTH_TEST_BASE: test and demo only (points a plugin's OAuth calls at a loopback fake)
  IRIS_QUOTE_EOF: not an env setting (heredoc marker)
  IRIS_TEST_NULL_EMBEDDINGS: test-only switch
