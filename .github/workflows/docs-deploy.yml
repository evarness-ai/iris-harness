name: docs-deploy

# Publishes the MkDocs site (R7) to GitHub Pages at mkdocs.yml's site_url. The pull-request
# check is ci.yml's `docs` job (the same strict build); this workflow only deploys, from
# `main` or by hand, never from a pull request. Security posture as in ci.yml: every action
# pinned to a full commit SHA, the token read-only except where the deploy job asks for
# Pages and the OIDC token it needs, checkout never persists credentials.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a queued run waits rather than cancelling a deploy mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # The same strict build as ci.yml's `docs` check, from the pinned
      # docs/requirements.txt, into a directory the Pages artifact reads.
      - name: Build the docs site (strict)
        run: |
          python -m venv "$RUNNER_TEMP/docs"
          "$RUNNER_TEMP/docs/bin/python" -m pip install --quiet -r docs/requirements.txt
          "$RUNNER_TEMP/docs/bin/mkdocs" build --strict --site-dir "$RUNNER_TEMP/site"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
