# The first-chat welcome (ADR-0127): the one turn IRIS opens itself, the first time a
# chat is opened on this install (once per IRIS_HOME, recorded in $IRIS_HOME/welcome.json).
#
# The list of what IRIS can do is not written here: it is the `summary` line of every
# mounted plugin's manifest, so it says what THIS install can do. These keys word the
# rest; a missing key falls back to the built-in wording (runtime/welcome.py).
#
#   intro           - the opening line, before the list
#   capability      - one list line; {summary} is the plugin's summary
#   no_capabilities - said instead of intro + list when no plugin has a summary
#   invitation      - asks for a first question
#   trace_note      - says where to see this turn: Call trace and Governance

intro: "Hi, I'm IRIS. This is the first chat on this install. Here is what I can do:"
capability: "- {summary}"
no_capabilities: >-
  No plugins are mounted yet, so for now I can talk with you and remember what you
  tell me.
invitation: "Ask me something to get started."
trace_note: >-
  No model wrote this reply: a deterministic handler did. Open Call trace to see this
  turn's path and the check it passed, and Governance for its audit rows.
