name: release

# Tag-driven release (OSS plan R11, R6): pushing `v<version>` builds the sdist and the
# wheel -- the web console's production build inside the wheel -- publishes them to PyPI
# with trusted publishing (OIDC: no API token exists anywhere), then publishes the
# GitHub release release-drafter drafted, with the files attached.
#
# The tag must equal pyproject's version (`v0.1.0` for 0.1.0). PyPI trusted publishing
# must be configured for this repository, this workflow file (release.yml) and the
# `pypi` environment before the first tag; the `pypi` environment should require the
# maintainer's approval, so a pushed tag alone never publishes.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["tool"]["poetry"]["version"])')
          if [[ "$TAG" != "v${version}" ]]; then
            echo "::error::tag ${TAG} does not match pyproject's version ${version} (expected v${version})"
            exit 1
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22" # the Dockerfile's webui stage
      - name: Build the web console (webui/dist)
        working-directory: webui
        run: |
          npm ci --no-audit --no-fund
          npm run build
      # Into the package: pyproject's `include` ships src/iris_harness/server/iris_api/
      # webui_dist/ in the sdist and the wheel (R6), where static_ui serves it from.
      - name: Bundle the web console into the package
        run: python scripts/bundle_webui.py
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: Build sdist and wheel
        run: uv build --sdist --wheel --out-dir dist
      # R6: "Wheel bundles webui/dist". Checked, not assumed: a wheel without the console
      # installs an `iris` whose API serves no UI. The path is the one static_ui reads
      # (PACKAGED_WEBUI_DIST), and the shell's hashed assets must ship beside it.
      - name: The wheel carries the web console
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = set(zipfile.ZipFile(wheel).namelist())
          dist = "iris_harness/server/iris_api/webui_dist/"
          if dist + "index.html" not in names:
              sys.exit(f"{wheel} has no {dist}index.html: R6 is not met")
          if not any(n.startswith(dist + "assets/") for n in names):
              sys.exit(f"{wheel} has the shell but no {dist}assets/: R6 is not met")
          print(f"{wheel}: web console at {dist}index.html")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/iris-harness
    permissions:
      id-token: write # trusted publishing: the OIDC token is the only credential
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    name: GitHub release
    needs: pypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # publish the release and attach the files
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      # release-drafter's draft for this tag when there is one, else a new release with
      # GitHub's generated notes.
      - name: Publish the release with the files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --verify-tag --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
