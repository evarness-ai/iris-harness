# The harness core's settings catalog (ADR-0120): every IRIS_* setting the core reads.
#
# A plugin's settings are NOT listed here; each plugin declares its own under
# `settings:` in its manifest.yaml. The completeness test
# (tests/unit/iris_harness/foundation/test_settings_store/test_catalog.py) fails when
# the code reads an IRIS_* name that no catalog declares, or a catalog declares a name
# nothing reads any more.
#
# applies: now (next call) | next_run (next heartbeat run) | restart (read at start or
# cached). guarded: changing it needs the owner's confirm. editable: false for secrets,
# paths, URLs, and settings with no production effect (their reason says so).

settings:
  IRIS_ACTIVITY_WORKERS:
    kind: int
    default: 1
    applies: restart
    label: Background activity workers
    description: Sets how many worker threads the background ActivityRunner uses (minimum 1).
    tab: advanced
  IRIS_ADAPTIVE_TIERS:
    kind: bool
    default: false
    applies: restart
    label: Adaptive tier downshift
    description: When on, the tier router's ResourceGovernor downshifts large local model tiers
      under host pressure (RAM, CPU load, thermal throttling); skipped entirely if IRIS_DISABLE_ARBITER
      is set.
    tab: models
  IRIS_AGENTIC_CORE_ENABLED:
    kind: enum
    default: '1'
    applies: restart
    label: AgenticCore rollout mode
    description: 'Selects the AgenticCore governed loop rollout: 0/false/no/off turns it off, ''shadow''
      runs it in shadow, anything else (default) turns it on.'
    tab: features
  IRIS_AGENTIC_CORE_P4:
    kind: bool
    default: false
    applies: restart
    label: Calendar/planner via agent loop
    description: When on, routes the calendar and planner intents through the one governed agentic
      loop (requires the base loop rollout on/shadow).
    tab: features
  IRIS_AGENT_SELF_MANAGEMENT:
    kind: bool
    default: false
    applies: now
    label: Agent self-management tools
    description: Adds the ADR-0086 self-management ReAct tools (introspect the agent's own brain,
      one of which compacts the conversation) to each turn's tool loop.
    tab: agents
  IRIS_ALLOWED_HOSTS:
    kind: list
    default: null
    applies: restart
    label: Extra allowed Host names
    description: Comma-separated host names (host, host:port or a URL) the HTTP services answer to
      besides the built-in ones (loopback, testserver, the compose service names, this machine's
      hostname, the host of IRIS_PUBLIC_URL and their short names); any other Host is refused
      with 400 (DNS rebinding). An IP literal is always accepted. '*' turns the check off.
    tab: none
    guarded: true
    guard_reason: It widens which Host names the services answer to, the DNS-rebinding defense.
    editable: false
    not_editable_reason: URL/host setting
  IRIS_API_HOST:
    kind: url
    default: 127.0.0.1
    applies: now
    label: Local services host
    description: Host `iris serve` binds the IRIS API to (as scripts/start_iris.sh binds every
      service), and the host health checks probe the local services on and the model inventory
      queries Ollama's /api/tags on.
    tab: none
    editable: false
    not_editable_reason: host address
  IRIS_API_PORT:
    kind: url
    default: 8003
    applies: restart
    label: IRIS API port
    description: Port `iris serve` binds the IRIS API to, and the port the health watch probes for
      its /healthz endpoint (default 8003).
    tab: none
    editable: false
    not_editable_reason: port
  IRIS_API_URL:
    kind: url
    default: http://localhost:8003
    applies: restart
    label: IRIS API base URL
    description: Base URL the CLI commands and the channel gateway use to reach the IRIS API (CLI
      defaults vary between http://localhost:8003 and http://127.0.0.1:8003).
    tab: none
    editable: false
    not_editable_reason: URL/host setting
  IRIS_AUTH_SECRET:
    kind: secret
    default: null
    applies: now
    label: Shared auth secret
    description: Shared bearer secret every request to the IRIS API, the governor and the channel
      gateway must present, except their liveness probes (a paired device presents its own token
      instead); unset or blank, those services refuse every such request rather than run open. The
      learning eval sandbox forwards it (default 'eval-sandbox') into its container.
    tab: none
    guarded: true
    guard_reason: It is the credential that decides who can authenticate to the API and channel
      gateway.
    editable: false
    not_editable_reason: secret
  IRIS_BEHAVIOR_BROAD_INTENTS:
    kind: list
    default: general,system,chat,other
    applies: restart
    label: Broad behavior intents
    description: Comma-separated intents treated as catch-all when matching behavior files, so they
      get the lower broad-intent weight instead of the full intent weight.
    tab: advanced
  IRIS_BEHAVIOR_BROAD_INTENT_WEIGHT:
    kind: float
    default: 0.5
    applies: restart
    label: Broad-intent behavior weight
    description: Sets the relevance weight a catch-all intent (general, system, chat, other) contributes
      when matching stored behaviors to a turn.
    tab: advanced
  IRIS_BEHAVIOR_INTENT_WEIGHT:
    kind: float
    default: 2.0
    applies: restart
    label: Behavior intent match weight
    description: Sets the relevance weight a behavior file earns when one of its specific match_intents
      matches the turn's intent.
    tab: advanced
  IRIS_BEHAVIOR_KEYWORD_WEIGHT:
    kind: float
    default: 1.0
    applies: restart
    label: Behavior keyword weight
    description: Sets the relevance weight a keyword match contributes when deciding which behavior
      files to inject into a turn.
    tab: advanced
  IRIS_BEHAVIOR_MATCH_THRESHOLD:
    kind: float
    default: 2.0
    applies: restart
    label: Behavior match threshold
    description: Minimum relevance score the best-matching behavior must reach in match_behavior
      before it is used for a turn; below it no behavior is selected.
    tab: features
  IRIS_BEHAVIOR_MINER:
    kind: bool
    default: false
    applies: restart
    label: Behavior pattern miner
    description: Turns on the local-tier behavior-pattern miner (digital-twin layer 1) that proposes
      behaviors for user approval; this env value is the default the learning console reverts to
      on restart.
    tab: agents
  IRIS_CHANNEL_GATEWAY_PORT:
    kind: url
    default: 8006
    applies: restart
    label: Channel gateway port
    description: Port the channel gateway listens on (launcher) and that the health check probes;
      default 8006.
    tab: none
    editable: false
    not_editable_reason: port
  IRIS_CHANNEL_GATEWAY_TELEGRAM_ENABLED:
    kind: bool
    default: true
    applies: restart
    label: Gateway Telegram poller
    description: When on, the channel gateway runs the Telegram long-poller; when off (and IRIS_RUNTIME_TELEGRAM_POLLER_ENABLED
      unset) the runtime's own Telegram poller starts instead.
    tab: guards
    guarded: true
    guard_reason: Changes which process polls the Telegram channel; both polling the same bot causes
      409 conflicts.
  IRIS_CHANNEL_GATEWAY_TRACING_ENABLED:
    kind: bool
    default: false
    applies: restart
    label: Channel gateway tracing
    description: Sets up Phoenix/OTEL tracing for the channel gateway service at startup.
    tab: advanced
  IRIS_COMPACTION_KEEP_RECENT:
    kind: int
    default: 10
    applies: restart
    label: Compaction keeps recent turns
    description: Sets how many of the most recent conversation turns are kept verbatim when the
      conversation is compacted.
    tab: advanced
  IRIS_COMPACTION_RATIO:
    kind: float
    default: 0.8
    applies: restart
    label: Conversation compaction ratio
    description: Fraction of the compactor's token budget the running history must reach before
      it is compacted (values outside 0-1 fall back to 0.8); also sizes the kept-verbatim window.
    tab: features
  IRIS_COMPACTION_THRESHOLD:
    kind: int
    default: 20
    applies: restart
    label: Conversation compaction threshold
    description: Turn-count floor at which a conversation is compacted into a summary (with the
      token budget also able to trigger compaction).
    tab: advanced
  IRIS_COMPACTION_TOKEN_BUDGET:
    kind: int
    default: null
    applies: restart
    label: Compaction token budget
    description: Sets the token budget at which the conversation compactor summarises older turns;
      unset uses a budget derived from the communication tier's context window.
    tab: models
  IRIS_CONFIG_DIR:
    kind: path
    default: null
    applies: restart
    label: Config directory
    description: Points the harness at the directory holding its YAML config (memory, skills, profiles,
      governance, finance categories, plugin dump); cached after first read. Unset resolves, in order,
      to the checkout's config/ when running from a checkout, else the defaults shipped inside the
      installed package (foundation/paths.py config_dir).
    tab: none
    editable: false
    not_editable_reason: path
  IRIS_CRYSTALLIZE_PREFLIGHT:
    kind: bool
    default: false
    applies: restart
    label: Crystallize replay preflight
    description: When on, each newly crystallized skill proposal is replayed through an isolated
      eval runtime and quarantined as preflight_failed if it fails quality.
    tab: agents
  IRIS_CURATOR_ESCALATION:
    kind: bool
    default: false
    applies: restart
    label: Tier escalation judge
    description: When truthy, builds the escalation judge that grades answers and (in enforce mode)
      re-runs capability gaps at a stronger tier; the env can only turn it on, config/escalation.yaml
      enabled:true also turns it on.
    tab: models
  IRIS_CURATOR_ESCALATION_CLOUD:
    kind: bool
    default: false
    applies: restart
    label: Cloud escalation allowed
    description: When on (or cloud.allow in escalation.yaml), the escalation judge may escalate
      a turn to a cloud tier for content classified as eligible (default only 'public'; 'secret'
      never).
    tab: guards
    guarded: true
    guard_reason: Turning it on lets turn content be sent to a cloud model on escalation.
  IRIS_CURATOR_ESCALATION_MODE:
    kind: enum
    default: shadow
    applies: restart
    label: Escalation judge mode
    description: 'Overrides the escalation judge mode from config/escalation.yaml: ''shadow'' only
      diagnoses and records, ''enforce'' lets the judge act (escalate) when it is enabled; other
      values are ignored.'
    tab: models
    guarded: true
    guard_reason: Enforce mode lets the judge escalate answers to other (possibly cloud) tiers,
      raising spend and egress.
  IRIS_CURATOR_ESCALATION_PRIORS:
    kind: bool
    default: false
    applies: restart
    label: Learned start-tier priors
    description: When on (or escalation.yaml priors.enabled), applies start-tier priors mined from
      escalation history to the router instead of running them in shadow.
    tab: models
    guarded: true
    guard_reason: Applying learned priors can start turns on a higher model tier, which may raise
      spend or use a cloud model.
  IRIS_CURATOR_FAITHFULNESS_LLM:
    kind: bool
    default: false
    applies: restart
    label: Faithfulness judge
    description: Builds an LLM faithfulness judge for the ResponseCurator's strict mode so answers
      are checked against their sources.
    tab: features
  IRIS_CURATOR_GROUNDING_LLM:
    kind: bool
    default: false
    applies: restart
    label: Grounding judge
    description: When on, an LLM grounding judge client is built for the curator to check responses
      that carry retrieved context.
    tab: features
  IRIS_CURATOR_LEAK_JUDGE:
    kind: bool
    default: true
    applies: restart
    label: Leak judge
    description: When not set to 0/false/no/off, builds an LLM leak judge that may clear responses
      the deterministic dump-phrase guard flagged; when off, that guard's halt stands.
    tab: guards
    guarded: true
    guard_reason: turning it off weakens the check that stops private data leaking into answers
  IRIS_CURATOR_OUTPUT_SAFETY:
    kind: bool
    default: false
    applies: restart
    label: Output safety guard
    description: When on, builds the Llama Guard 3 output-safety judge the curator uses to check
      responses (shadow/warn-only unless enforce categories are configured).
    tab: guards
    guarded: true
    guard_reason: It is an output safety guard; turning it off removes that check.
  IRIS_CURATOR_OUTPUT_SAFETY_TIMEOUT_S:
    kind: float
    default: 12.0
    applies: restart
    label: Output safety guard timeout
    description: Per-call time budget in seconds (clamped 1-60) for the output-safety guard, which
      fails open on timeout.
    tab: guards
    guarded: true
    guard_reason: The guard fails open on timeout, so a smaller budget makes unsafe output easier
      to let through.
  IRIS_DATA_DIR:
    kind: path
    default: data
    applies: restart
    label: Data directory
    description: Relocates every local data store (memory.db, chroma, tasks.db, finance and email
      stores, etc.).
    tab: none
    editable: false
    not_editable_reason: path
  IRIS_DEPLOYMENT_LABEL:
    kind: str
    default: ''
    applies: now
    label: Deployment label
    description: Sets the deployment name returned to the web console, which shows it as a badge;
      empty when unset.
    tab: advanced
  IRIS_DISABLE_ARBITER:
    kind: bool
    default: false
    applies: restart
    label: Disable resource arbiter
    description: Any non-empty value (even 0) skips attaching the Ollama arbiter ResourceGovernor
      to the tier router.
    tab: models
  IRIS_DISABLE_WARMUP:
    kind: bool
    default: false
    applies: restart
    label: Disable model warm-up
    description: When set to any non-empty value, skips the background warm-up calls that pre-load
      the router and executor models at startup (the playground and eval harness also set it for
      their own runtimes).
    tab: advanced
  IRIS_EMBED_BACKEND:
    kind: enum
    default: onnx
    applies: now
    label: Corpus embedding backend
    description: 'Chooses the embedding backend for corpus embeddings: ''onnx'' (the shared ONNX
      MiniLM, default model only) or ''sentence-transformers'' (needs the optional ML extra); any
      other value raises an error.'
    tab: none
    editable: false
    not_editable_reason: switching it makes the stored vectors unusable until a reindex
  IRIS_ENABLE_COPILOT_BACKEND:
    kind: bool
    default: false
    applies: restart
    label: GitHub Copilot backend
    description: Opts in to the GitHub Copilot cloud LLM provider (providers report available when
      set; copilot_auth requires exactly '1' before any network call); errors.py:20 only matches
      it in an error message.
    tab: models
    guarded: true
    guard_reason: Enables a cloud LLM provider, so prompts can leave the machine and usage is billed.
  IRIS_EVALUATOR_PORT:
    kind: url
    default: 8090
    applies: restart
    label: Evaluator port
    description: Port where the remote governance evaluator sidecar is probed for /healthz.
    tab: none
    editable: false
    not_editable_reason: port
  IRIS_EVAL_SANDBOX:
    kind: enum
    default: effect
    applies: restart
    label: Eval sandbox mode
    description: 'Chooses how skill-proposal pre-flight replays are contained: effect (neutralize
      side effects), docker (full container), or off (no containment).'
    tab: guards
    guarded: true
    guard_reason: Setting it to off removes side-effect containment from pre-flight eval replays.
  IRIS_FACT_EXTRACTION_MODE:
    kind: enum
    default: llm
    applies: now
    label: Fact extraction mode
    description: Set to regex to extract user facts with regex patterns instead of the LLM extractor;
      any other value uses the LLM.
    tab: features
  IRIS_FACT_HISTORY_RETENTION_DAYS:
    kind: int
    default: 180
    applies: now
    label: Fact history retention days
    description: Sets the default age in days used by the `iris facts retention` command when no
      --older-than value is given.
    tab: advanced
  IRIS_FAKE_MODEL_SCRIPT:
    kind: path
    default: null
    applies: now
    label: Fake model script
    description: The YAML script the scripted fake model (provider `fake`) answers from when no
      script was installed in-process (iris_harness.testing does that).
    tab: none
    editable: false
    not_editable_reason: file path
  IRIS_FEEDBACK_CAPTURE:
    kind: bool
    default: false
    applies: now
    label: Answer feedback (thumbs)
    description: When on, the API reports feedback_capture=true so the web UI shows the thumbs up/down
      answer-feedback control.
    tab: features
  IRIS_FEEDBACK_CLARIFY:
    kind: bool
    default: false
    applies: now
    label: Judge-gated clarify nudge
    description: When exactly '1', appends one gentle invitation to refine to an answer when the
      judge or router signals uncertainty (never on a confident answer).
    tab: features
  IRIS_FILEMANAGER_AGENT:
    kind: bool
    default: false
    applies: restart
    label: FileManager agent loop
    description: When on, registers a first-class filemanager agent to answer the files intent (requires
      the base loop rollout on/shadow).
    tab: agents
    agent: filemanager
  IRIS_GENERAL_TOOL_MAX_TURNS:
    kind: int
    default: 4
    applies: now
    label: General tool loop budget
    description: Base number of tool turns (bounded 1-128) the general agent loop may take before
      stopping; the cap var lifts it for continuation/auth-related queries.
    tab: advanced
  IRIS_GENERAL_TOOL_MAX_TURNS_CAP:
    kind: int
    default: 8
    applies: now
    label: General tool-loop turn cap
    description: Upper bound (clamped 1-128) on tool-call turns in the general tool loop, including
      the adaptive bump.
    tab: models
  IRIS_GOVERNANCE_ALLOWED_TOOLS:
    kind: list
    default: null
    applies: restart
    label: Governance tool allowlist
    description: Comma-separated exact tool names the governance kernel allows; unset means no allowlist
      (all tools).
    tab: guards
    guarded: true
    guard_reason: Changes which tools the governance kernel lets run.
  IRIS_GOVERNANCE_APPROVALS_ENABLED:
    kind: bool
    default: true
    applies: restart
    label: Governance approval queue
    description: When on, require_approval verdicts enqueue an approval and notify channels; when
      off, halts are advisory only.
    tab: guards
    guarded: true
    guard_reason: Turning it off makes governance halts advisory with no approval queued.
  IRIS_GOVERNANCE_AUDIT_DB_PATH:
    kind: path
    default: null
    applies: restart
    label: Governance audit DB path
    description: 'Overrides where the governance audit ledger database is stored (default: governance
      data dir/audit.db).'
    tab: none
    editable: false
    not_editable_reason: file path
  IRIS_GOVERNANCE_BLOCKED_TOOLS:
    kind: list
    default: null
    applies: restart
    label: Blocked tools
    description: Comma-separated tool names the governance kernel blocks.
    tab: guards
    guarded: true
    guard_reason: Removing names from the list lets previously blocked tools run.
  IRIS_GOVERNANCE_COMMAND_SANDBOX:
    kind: bool
    default: true
    applies: restart
    label: Command sandbox
    description: Registers the governance CommandSandbox (on by default); 0/false/no/off disables
      it without dropping the rest of the kernel.
    tab: guards
    guarded: true
    guard_reason: Turning it off removes the sandbox on shell commands the agent runs.
  IRIS_GOVERNANCE_CONFIRM_ONCE_TOOLS:
    kind: list
    default: null
    applies: restart
    label: Extra ask-first tools
    description: Comma-separated tool names that must ask for confirmation once, added on top of
      each tool's own declaration; unset or 'none' adds nothing.
    tab: guards
    guarded: true
    guard_reason: 'Governance setting: removing names drops confirmation prompts an operator added.'
  IRIS_GOVERNANCE_COST_ENFORCE:
    kind: bool
    default: true
    applies: restart
    label: Enforce daily cost cap
    description: When on, a call that would pass the daily cost cap is refused; off only records
      spend.
    tab: guards
    guarded: true
    guard_reason: Turning it off lets LLM spend exceed the daily cap.
  IRIS_GOVERNANCE_COST_LEDGER_DB_PATH:
    kind: path
    default: null
    applies: restart
    label: Cost ledger database
    description: Path of the SQLite cost ledger the cost limiter writes and the cost summary reads;
      unset uses CostStore's default location.
    tab: none
    editable: false
    not_editable_reason: file path
  IRIS_GOVERNANCE_COST_LIMITER_ENABLED:
    kind: bool
    default: false
    applies: restart
    label: Cost limiter
    description: When truthy, registers the cost limiter, which records LLM spend and (with cost
      enforce on) refuses calls past the daily cap.
    tab: guards
    guarded: true
    guard_reason: Controls the daily LLM spend ledger and cap.
  IRIS_GOVERNANCE_DAILY_COST_CAP_USD:
    kind: float
    default: 5.0
    applies: restart
    label: Daily cost cap (USD)
    description: Daily spend cap in USD the cost limiter enforces when IRIS_GOVERNANCE_COST_LIMITER_ENABLED
      is on (unparseable values fall back to $5.00).
    tab: guards
    guarded: true
    guard_reason: Raising it raises the allowed daily spend.
  IRIS_GOVERNANCE_DISPLAY_MASK:
    kind: bool
    default: true
    applies: now
    label: Email display masking
    description: Masks email addresses in displayed text and streams (on unless explicitly turned
      off); the audit ledger keeps originals.
    tab: guards
    guarded: true
    guard_reason: Turning it off shows full email addresses in displayed output.
  IRIS_GOVERNANCE_DRIFT_EXEMPTIONS_DB_PATH:
    kind: path
    default: null
    applies: restart
    label: Drift exemptions DB path
    description: Overrides where approved goal-drift exemptions are stored; unset uses the governance
      data dir drift_exemptions.db.
    tab: none
    guarded: true
    guard_reason: Pointing at another file changes which goal-drift exemptions are honoured.
    editable: false
    not_editable_reason: path
  IRIS_GOVERNANCE_ENABLED:
    kind: bool
    default: true
    applies: restart
    label: Governance kernel
    description: Enables the governance kernel (secure by default; only an explicit 0/false/no/off
      disables it).
    tab: guards
    guarded: true
    guard_reason: Disabling it removes the whole governance kernel.
  IRIS_GOVERNANCE_EVALUATOR_MODE:
    kind: enum
    default: local
    applies: restart
    label: Governance evaluator mode
    description: Set to remote to have the kernel use the remote evaluator sidecar (IRIS_GOVERNANCE_EVALUATOR_URL)
      instead of the in-process evaluator registry; health checks then also probe the sidecar.
    tab: guards
    guarded: true
    guard_reason: Moves governance evaluation to an external sidecar service.
  IRIS_GOVERNANCE_EVALUATOR_TIMEOUT_S:
    kind: float
    default: 5.0
    applies: restart
    label: Remote evaluator timeout
    description: Sets the timeout in seconds for calls to the remote governance evaluator; on failure
      local-tier runs fail open and cloud-tier runs fail closed.
    tab: guards
    guarded: true
    guard_reason: A shorter timeout makes local-tier governance checks fail open more often.
  IRIS_GOVERNANCE_EVALUATOR_URL:
    kind: url
    default: http://127.0.0.1:8090
    applies: restart
    label: Remote evaluator URL
    description: Base URL of the remote governance evaluator used when evaluator mode is 'remote';
      the CLI evaluator commands also use it.
    tab: none
    guarded: true
    guard_reason: It changes which service makes governance evaluation decisions.
    editable: false
    not_editable_reason: URL/host setting
  IRIS_GOVERNANCE_FS_JAIL:
    kind: bool
    default: true
    applies: restart
    label: Filesystem jail
    description: Registers the governance FSJail (on by default); 0/false/no/off disables it without
      dropping the rest of the kernel.
    tab: guards
    guarded: true
    guard_reason: Turning it off removes the filesystem jail on agent file access.
  IRIS_GOVERNANCE_GOAL_DRIFT_MAX_DISTANCE:
    kind: float
    default: null
    applies: restart
    label: Goal drift max distance
    description: Sets the goal_drift signal's max distance (0.0-2.0) before a turn is flagged; unset
      keeps the signal default of 0.90.
    tab: guards
    guarded: true
    guard_reason: Raising the threshold lets more off-goal turns pass the drift guard.
  IRIS_GOVERNANCE_JUDGE_CLOUD_OPT_IN:
    kind: bool
    default: false
    applies: restart
    label: Cloud safety judge opt-in (old)
    description: Let judge_from_env's judge use tier_3 (cloud); production does not build that judge.
    tab: none
    editable: false
    not_editable_reason: superseded by IRIS_GOVERNANCE_JUDGE_TIER, which the wired judge reads
  IRIS_GOVERNANCE_JUDGE_ENABLED:
    kind: bool
    default: false
    applies: now
    label: Governance safety judge
    description: After every agent run that used tools, a background judge scores the trace and the
      answer for hallucination, goal alignment, tool misuse and danger, on the model IRIS_GOVERNANCE_JUDGE_TIER
      picks; a halt recommendation alerts your channels, the rest go to the audit log.
    tab: guards
    guarded: true
    guard_reason: turning it off stops the post-run safety review of every tool-using run
  IRIS_GOVERNANCE_JUDGE_MODEL_TIER:
    kind: enum
    default: tier_2
    applies: restart
    label: Governance judge tier (old)
    description: Picked a governance tier label for the judge built by judge_from_env, which production
      does not use.
    tab: none
    editable: false
    not_editable_reason: superseded by IRIS_GOVERNANCE_JUDGE_TIER, which the wired judge reads
  IRIS_GOVERNANCE_JUDGE_TIMEOUT_S:
    kind: float
    default: 30.0
    applies: now
    label: Safety judge timeout (s)
    description: How long one post-run review may take before it is recorded as a judge failure (non-positive
      or invalid values fall back to 30).
    tab: guards
  IRIS_GOVERNANCE_JUDGE_TIER:
    kind: str
    default: run
