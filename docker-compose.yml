# One-command local IRIS stack:  docker compose up
#
# Brings up the full privacy-first stack — containerized Ollama (Tier 1/2 local
# models, auto-pulled on first run), the Governor policy service, and the IRIS
# chat API with embedded Arize Phoenix observability. No .env is required: dev
# defaults boot a working local-only instance; drop a .env beside this file to
# add real credentials / overrides.
#
# Mac note: containerized Ollama is CPU-only. For Metal-accelerated tiers, run
# the host's native Ollama and use the override:
#   docker compose -f docker-compose.yml -f docker-compose.hostllm.yml up governor iris-api
#
# Every published port is bound to 127.0.0.1: the stack is for this machine only. A bare
# "8003:8003" listens on every interface (on Linux, past the host firewall), which put
# Ollama and Phoenix, neither of which asks for a token, on the LAN. To reach IRIS from
# another device, put an authenticated tunnel (e.g. `tailscale serve`) in front instead.
#
# Every container: no Linux capabilities and no privilege gain after start
# (tests/unit/test_container). The containers create every volume, so root owns all of it.
x-hardening: &hardening
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:

  # ── Ollama ────────────────────────────────────────────────────────────────
  # Local LLM runtime for the Tier 1/2 models in config/llm_tiers.yaml.
  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    <<: *hardening
    restart: unless-stopped

  # ── Ollama model puller (one-shot) ─────────────────────────────────────────
  # Pulls the tier models once Ollama is healthy, so `up` needs no manual step.
  # Re-runs are no-ops once the weights are cached. Keep in sync with
  # config/llm_tiers.yaml (router=llama3.2:3b, tier1=granite4, tier2=qwen2.5).
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: "http://ollama:11434"
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "ollama pull llama3.2:3b &&
       ollama pull granite4:latest &&
       ollama pull qwen2.5:7b-instruct"
    <<: *hardening
    restart: "no"

  # ── Governor ──────────────────────────────────────────────────────────────
  # Policy engine, rate limiter, and audit trail. Healthy before iris-api starts.
  governor:
    build:
      context: .
      # Same image as iris-api, so the same build args: the `phoenix` extra (the
      # Elastic-2.0 trace UI the core install leaves out) for iris-api's embedded Phoenix.
      args:
        POETRY_EXTRAS: phoenix
    image: iris:latest
    command: uvicorn iris_harness.server.governor.main:app --host 0.0.0.0 --port 8080
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - iris-data:/app/data
      - ./config:/app/config:ro
    env_file:
      - path: .env
        required: false
    environment:
      # Required — no default. A shipped default would be a publicly-known
      # shared secret; compose fails fast with this message if it is unset.
      IRIS_AUTH_SECRET: "${IRIS_AUTH_SECRET:?set IRIS_AUTH_SECRET (e.g. in .env) to a long random string}"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    <<: *hardening
    restart: unless-stopped

  # ── IRIS API ──────────────────────────────────────────────────────────────
  # Main chat API. Embedded Arize Phoenix observability UI on port 6006.
  iris-api:
    build:
      context: .
      args:
        POETRY_EXTRAS: phoenix   # embedded Phoenix below needs the `phoenix` extra
    image: iris:latest
    command: uvicorn iris_harness.server.iris_api.main:app --host 0.0.0.0 --port 8003
    ports:
      - "127.0.0.1:8003:8003"
      - "127.0.0.1:6006:6006"   # Arize Phoenix observability UI
    volumes:
      - iris-data:/app/data
      - ./config:/app/config:ro
    env_file:
      - path: .env
        required: false
    environment:
      # Compose service names override the localhost defaults.
      OLLAMA_BASE_URL: "http://ollama:11434"
      # The owner's time zone: "now"/"today", the digest and reminders read IRIS_TZ; the
      # container clock follows it too.
      IRIS_TZ: "${IRIS_TZ:-}"
      TZ: "${IRIS_TZ:-UTC}"
      IRIS_GOVERNOR_BASE_URL: "http://governor:8080"
      # Required — no default. A shipped default would be a publicly-known
      # shared secret; compose fails fast with this message if it is unset.
      IRIS_AUTH_SECRET: "${IRIS_AUTH_SECRET:?set IRIS_AUTH_SECRET (e.g. in .env) to a long random string}"
      # Embedded Phoenix/OTEL observability, persisted to the data volume.
      IRIS_PHOENIX_ENABLED: "1"
      IRIS_PHOENIX_PORT: "6006"
      IRIS_PHOENIX_WORKING_DIR: "/app/data/phoenix"
      IRIS_OTEL_ENABLED: "1"
      IRIS_OTEL_LANGCHAIN_ENABLED: "1"
      IRIS_OTEL_HTTPX_ENABLED: "1"
    depends_on:
      governor:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8003/healthz"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    <<: *hardening
    restart: unless-stopped


volumes:
  iris-data:       # SQLite databases + ChromaDB vectors + persisted Phoenix traces
  ollama-models:   # Downloaded Ollama model weights
