name: morning_note
version: 0.1.0
description: A morning note, sent to the owner's channel (Telegram) on a schedule.
# Provenance: who wrote this plugin. Left as `untrusted` so a copy of this manifest does
# not claim to be the harness's own code; change it only to say what is true of yours.
party: untrusted
entrypoint: morning_note:setup
flavor: python
trust: in-process
provides:
  - heartbeat
