name: ci

# The required pull-request checks of OSS plan R11 that run on the tree: lint, test (3.12),
# playground, quickstart, licenses, docs and webui. security.yml and pr.yml carry the rest.
# Contributors run the same steps locally with scripts/ci_local.sh.
#
# Test policy (owner's instruction, 2026-10): a pull request or a push to main runs the
# CHANGED-SCOPE tests on Python 3.12 only (scripts/changed_tests.sh, which never escalates
# to the whole suite on the hosted runner). The full suite on 3.12 AND 3.13 is kept, on
# demand: `gh workflow run ci -f full=true` (or Actions -> ci -> Run workflow -> full).
#
# Security posture, for every workflow here: `pull_request` only, never
# `pull_request_target` (a fork's code never runs with this repository's secrets or a
# write token); every action pinned to a full commit SHA (Dependabot bumps them); the
# token is read-only unless a job says otherwise; checkout never persists credentials.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: "Run the entire test suite on Python 3.12 and 3.13 (default: changed-scope on 3.12)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  IRIS_AUTH_SECRET: ci-only-secret
  IRIS_DISABLE_WARMUP: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  POETRY_VERSION: "2.3.3"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Poetry and the project (dev + email)
        run: |
          pipx install "poetry==${POETRY_VERSION}"
          poetry config virtualenvs.in-project true
          poetry env use python3.12
          poetry install --with dev --extras email --no-interaction --no-ansi
      - name: Lockfile matches pyproject
        run: poetry check --lock
      - name: Ruff
        run: poetry run ruff check src/ tests/ examples/
      - name: Black
        run: poetry run black --check src/ tests/ examples/
      - name: Mypy (src)
        run: poetry run mypy src/iris_harness/ src/memris/ src/iris_personal/
      # The examples type-check against the stable tier, as a plugin author's code would.
      - name: Mypy (examples)
        run: poetry run mypy examples/
      - name: Import contracts
        run: poetry run lint-imports

  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # 3.12 only, except a manual run with full=true, which adds 3.13.
        python-version: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.full && '["3.12", "3.13"]' || '["3.12"]') }}
    env:
      FULL_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The changed-scope selector diffs against the PR base / the previous push.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry and the project (dev + email)
        env:
          PY: ${{ matrix.python-version }}
        run: |
          pipx install "poetry==${POETRY_VERSION}"
          poetry config virtualenvs.in-project true
          poetry env use "python${PY}"
          poetry install --with dev --extras email --no-interaction --no-ansi
      # On demand (workflow_dispatch, full=true): the full suite -- core, the email slice
      # and every example -- on each Python in the matrix. No model is pulled and no test
      # reaches the network (tests/conftest.py guards both).
      - name: Pytest (full suite, on demand)
        if: env.FULL_RUN == 'true'
        run: poetry run pytest --no-cov -n auto -q
      # Pull requests and pushes: only what the changed files can reach. NO_FULL=1 keeps
      # the selector from escalating to the whole suite (a trigger file such as
      # pyproject.toml or a source path with no test home): it runs `-m smoke` plus the
      # mapped tests instead, and the summary says the full suite was skipped by policy.
      - name: Pytest (changed scope)
        if: env.FULL_RUN != 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PY_VERSION: ${{ matrix.python-version }}
          NO_FULL: "1"
        run: |
          case "$EVENT_NAME" in
            pull_request) BASE="$PR_BASE_SHA" ;;
            push) BASE="$PUSH_BEFORE_SHA" ;;
            *) BASE="" ;;
          esac
          # A new branch or a force push has no usable `before`: fall back to the parent.
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            BASE=$(git merge-base HEAD origin/main 2>/dev/null || true)
            [[ -n "$BASE" && "$BASE" != "$(git rev-parse HEAD)" ]] || BASE=$(git rev-parse HEAD~1)
          fi
          export BASE
          plan=$(bash scripts/changed_tests.sh --print)
          {
            echo "### Changed-scope tests (Python ${PY_VERSION})"
            echo
            echo "Compared against \`${BASE}\`."
            echo
            echo '```'
            echo "$plan"
            echo '```'
            if grep -q "SKIPPED by policy" <<<"$plan"; then
              echo
              echo "> The full suite was skipped by policy on pull requests and pushes."
              echo "> Run it on 3.12 and 3.13 with: \`gh workflow run ci -f full=true\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$plan"
          # Never a green line without tests when code changed.
          if git diff --name-only "$BASE" HEAD | grep -qE '^(src|tests|examples)/' \
            && ! grep -qE "running:|smoke marker only" <<<"$plan"; then
            echo "::error title=test::source files changed but the selector chose no tests"
            exit 1
          fi
          bash scripts/changed_tests.sh

  playground:
    name: playground
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Poetry and the project (dev + email)
        run: |
          pipx install "poetry==${POETRY_VERSION}"
          poetry config virtualenvs.in-project true
          poetry env use python3.12
          poetry install --with dev --extras email --no-interaction --no-ansi
      # End-to-end runs against a real in-process runtime: the smoke-marked tests
      # (deselected from the plain suite) and the deterministic playground suite.
      - name: Pytest (smoke marker)
        run: poetry run pytest --no-cov -n auto -q -m smoke
      - name: Playground (core-deterministic)
        run: poetry run iris playground run core-deterministic

  quickstart:
    name: quickstart
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      # The README's hero path (R6) on the scripted fake model, offline after the
      # install: `uv tool install "iris-harness[email]"` (timed, cold cache; R19 target
      # < 60 s, reported in the job summary), `iris doctor`, `iris email demo`.
      - name: Fresh install, iris doctor, iris email demo
        run: bash scripts/ci_quickstart.sh

  licenses:
    name: licenses
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # The core install (R19): what a plain `pip install iris-harness` puts in an
      # environment, no extras, resolved fresh as a user's install is. Every
      # distribution's license must be on scripts/license_policy.toml's allow list;
      # arize-phoenix (Elastic-2.0) is denied outright, a guard: IRIS no longer depends on it.
      - name: Core install into a fresh venv
        run: |
          python -m venv "$RUNNER_TEMP/core"
          "$RUNNER_TEMP/core/bin/python" -m pip install --quiet --upgrade pip
          "$RUNNER_TEMP/core/bin/python" -m pip install --quiet .
      - name: License allow list
        run: '"$RUNNER_TEMP/core/bin/python" scripts/check_licenses.py --list'

  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # The MkDocs site (R7). Until mkdocs.yml exists this job says so and passes;
      # once it exists the build is strict (a broken link or a missing page fails), and
      # its pinned dependencies must be in docs/requirements.txt.
      - name: Build the docs site (strict)
        run: |
          if [[ ! -f mkdocs.yml ]]; then
            echo "::notice title=docs::no mkdocs.yml in this tree yet: nothing to build (R7 adds the site)"
            echo "docs: SKIPPED -- no mkdocs.yml" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ ! -f docs/requirements.txt ]]; then
            echo "::error title=docs::mkdocs.yml exists but docs/requirements.txt (the site's pinned dependencies) does not"
            exit 1
          fi
          python -m venv "$RUNNER_TEMP/docs"
          "$RUNNER_TEMP/docs/bin/python" -m pip install --quiet -r docs/requirements.txt
          "$RUNNER_TEMP/docs/bin/mkdocs" build --strict --site-dir "$RUNNER_TEMP/site"

  # The web console (webui/): what release.yml builds into the wheel must lint, type-check
  # and build on every change, not first at tag time, and its Playwright specs must pass.
  # It runs on every PR, webui/ changed or not: a workflow skipped by a `paths:` filter
  # leaves a required check pending forever, and the job is a few minutes.
  webui:
    name: webui
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Playwright's own image carries the browsers and every system library they need, so
    # the job never apt-installs them from the runner's Ubuntu mirror (a slow mirror once
    # stalled `playwright install --with-deps` past the timeout). Its tag must match the
    # @playwright/test version in webui/package-lock.json; it is pinned by digest. The
    # image's documented GitHub Actions setup runs as uid 1001.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --user 1001
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22" # release.yml and the Dockerfile's webui stage
      - name: Install (npm ci, the lockfile exactly)
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx --no-install tsc --noEmit
      - name: Build
        run: npm run build
      # The Playwright specs under webui/tests, as scripts/ci_local.sh runs them: the phone
      # viewport smoke, nav gating, Setup, Governance and Call trace, against canned
      # fixtures (no API). playwright.config.ts's webServer builds and serves `vite preview`
      # itself (with CI set it never reuses a running server).
      # Two engines: WebKit (iPhone 13, the target) and Chromium for the one
      # service-worker spec, which Playwright runs only there. Both come with the image.
      - name: Playwright specs
        run: npx --no-install playwright test
