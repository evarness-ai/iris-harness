# The plugin's contract with IRIS (docs/architecture/plugin-contract.md).
#
# A declarative plugin: this file is the whole plugin. Each tool names the plain function
# it runs (`impl: package.module:function`), what the model reads about it
# (`description`) and its arguments (`args`); IRIS checks every call's arguments against
# them before the function runs, so a bad call reaches the model as an observation, never
# as an exception. There is no setup() to write.
#
# `effect`: `read` leaves the owner's world as it was; `write` changes something (the
# loop asks once per run); `destructive` removes the owner's data (approved per call).
#
# Argument types: string, number, integer, boolean, enum (with `options`). An argument is
# required unless it says `required: false`; an optional one may give a `default`.
name: __tmpl_name
version: 0.1.0
description: __tmpl_title -- __tmpl_summary.
# Provenance: who wrote this plugin. Left as `untrusted` so a copy of this manifest does
# not claim to be the harness's own code; change it only to say what is true of yours.
party: untrusted
flavor: declarative
provides:
  - tool
tools:
  __tmpl_{tool}_convert_length:
    effect: read
    content: internal
    description: Convert a length from one unit to another.
    impl: __tmpl_package.functions:convert_length
    args:
      value:
        type: number
        description: The length to convert.
      from_unit:
        type: enum
        options: [mm, cm, m, km, in, ft, mi]
        description: The unit the length is in.
      to_unit:
        type: enum
        options: [mm, cm, m, km, in, ft, mi]
        description: The unit to convert to.
      digits:
        type: integer
        required: false
        default: 3
        description: Decimal places in the answer.
