# The stable tier (OSS plan R16): what a plugin, an example and the `iris plugin new`
# scaffold may import and rely on. Anything listed here changes only after a
# deprecation cycle (docs/reference/stable-api.md); everything else in the tree is
# internal and may change in any release. `iris_harness.testing.check_stable_imports`
# reads this file, and tests/unit/test_stable_tier.py holds the tree to it.
version: 0.1.0

# Whole packages: every module under each, and in every module exactly the names its
# `__all__` lists. A name missing from `__all__` is internal even inside these packages.
packages:
  - iris_harness.sdk
  - iris_harness.testing

# The SDK's extension protocols ride on this rule: `sdk.research.SearchProvider` (what
# `PluginAPI.register_search_provider` adds to the research tool's chain) with the frozen
# `SearchHit` it returns, and `sdk.channels.IChannelConnector` (what `register_channel`
# takes) are stable as names of their modules' `__all__`, recorded in the name snapshot.
# `SearchResult` -- the research engine's own mutable result, with the score, trust and
# content the engine fills -- left the tier before 0.1.0 (it was never released stable):
# a provider returns `SearchHit`, and the engine keeps its result type to itself.

# Single names at their home module, where only part of a module is stable. The mail
# provider contract lives in the email slice, not the SDK: the core never imports
# iris_personal (contract core-does-not-import-iris-personal), so the SDK cannot
# re-export it. `provider_api` is its one facade: the interface, the types its methods
# use, the narrow store a sync writes (MailSyncStore -- the record itself, EmailStore,
# is not stable), registration, connecting an account, the write-approval check and
# the governed write (`mailbox_write`: the check, then the write, then its ledger row,
# with the `WriteTally` it yields).
names:
  iris_personal.email.provider_api:
    - MailProvider
    - LabellingProvider
    - MailSyncStore
    - FetchResult
    - DownloadedAttachment
    - AttachmentCandidate
    - EmailMessage
    - EmailAttachment
    - ProgressFn
    - WriteTally
    - connect_account
    - default_sync_store
    - mailbox_write
    - register_mail_provider
    - require_mailbox_writes

# The top-level packages the tree ships. An import from any of them must be in the
# tier above; imports from anything else (the standard library, third-party packages,
# a plugin's own modules) are not the tier's business.
project_roots:
  - iris_harness
  - iris_personal
  - iris_code
  - memris

# PluginAPI's registration kinds (RegistrationKind).
registration_kinds:
  - intercept
  - tool
  - intent_handler
  - heartbeat
  - channel
  - confirmation_executor

# The entry-point group installed plugins are discovered under.
entry_point_group: iris_harness.plugins

# The manifest schema: every top-level key a manifest.yaml may carry (PluginManifest).
manifest_fields:
  - name
  - version
  - description
  - summary
  - entrypoint
  - cli
  - flavor
  - trust
  # Provenance. The default is `untrusted` (fail-closed, ADR-0134); only the field's
  # name and place are pinned here, and a plugin the project ships declares `first-party`.
  - party
  - provides
  - requires
  - uses
  # Issue #103: the hosts the plugin's code may contact (declared; enforced separately).
  - egress
  - capabilities
  - identity
  - search_providers
  - tools
  - read_first_intents
  - ontology
  - settings
  - expiry
  - locked
  - webui

# The plugin flavors (PluginManifest.flavor): `python` mounts by running the plugin's
# setup(); `declarative` is a manifest-only plugin (plan decision 5) whose tools bind to
# plain functions. A declarative tool entry carries these keys beyond any tool's
# declaration (ToolDeclaration), and each of its `args` these (ToolArg).
manifest_flavors:
  - python
  - declarative
declarative_tool_fields:
  - description
  - impl
  - args
declarative_arg_fields:
  - type
  - description
  - required
  - default
  - options

# The quickstart CLI (R6's hero path: `serve` runs the API the scheduled jobs live in), plus the owner's one-time mailbox-write
# approval: every refused write names it, and the `mail-provider` scaffold's generated
# test runs it, so a third party's tests depend on it.
quickstart_cli:
  - [doctor]
  - [serve]
  - [email, demo]
  - [email, setup]
  - [email, writes, approve]

# The stable settings: the environment variables a release-1 email install relies on,
# from what the getting-started pages, the email guide and `iris doctor` tell a user to
# set. A name and its default here change only after a deprecation cycle; every other
# setting in the catalog is configuration and may change in a 0.x release.
# scripts/gen_reference_docs.py lists these first on docs/reference/environment-variables.md
# and fails when one is missing from the email profile's settings catalog.
settings:
  # Running the IRIS API (`iris serve`) and reaching it from the CLI.
  - IRIS_AUTH_SECRET
  - IRIS_API_HOST
  - IRIS_API_PORT
  - IRIS_API_URL
  # Serving beyond loopback: the names the Host-header guard answers to.
  - IRIS_PUBLIC_URL
  - IRIS_ALLOWED_HOSTS
  # Where IRIS keeps its state, its vault key, and which plugins mount.
  - IRIS_HOME
  - IRIS_VAULT_MASTER_KEY
  - IRIS_PROFILE
  - IRIS_DEMO_HOME
  # When the scheduled jobs run.
  - IRIS_TZ
  # The email judge.
  - IRIS_EMAIL_JUDGE
  - IRIS_EMAIL_JUDGE_LABELS
  - IRIS_EMAIL_JUDGE_UNSURE_BELOW

# Trees whose Python files may import only the tier above, relative to the repo root:
# the examples, and the `iris plugin new` templates (what they generate is a third
# party's plugin, so it may import nothing else).
enforced_roots:
  - examples
  - src/iris_harness/cli/templates/plugin
